spring:
  application:
    name: Hs-web-backended
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  web:
    resources:
      static-locations: file:D:/images/, classpath:/static/, classpath:/public/
  #mysql连接配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hs
    #    url: jdbc:mysql://mysql:3306/hs
    username: root
    password: 1234

# 文件上传路径配置
tlias:
  upload:
    dir: D:/images/
# JWT 配置
jwt:
  sign-key: SVRIRUlNQUJDRGVGR0hJSktMTU5PUFFSU1RVVldYWVoxMjM0NTY3ODkwYWJjZGVm
  expire: 43200000

mybatis:
  mapper-locations: classpath:com.jsu.mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
pagehelper:
  reasonable: true
  helper-dialect: mysql
#spring事务管理日志
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug