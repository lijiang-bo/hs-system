<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLIAS 管理后台</title>
    <style>
        :root {
            --bg: #f3f6fb;
            --card: #ffffff;
            --text: #1f2a44;
            --muted: #6b7895;
            --primary: #4f7cff;
            --primary-dark: #2f5eea;
            --success: #10b981;
            --danger: #ef4444;
            --border: #e6ebf4;
            --shadow: 0 10px 30px rgba(22, 34, 66, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(120deg, #eef3ff, #f7f9fc);
            color: var(--text);
        }

        .hidden {
            display: none !important;
        }

        .login-wrap {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 30px 26px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 6px;
        }

        .subtitle {
            color: var(--muted);
            margin: 0 0 22px;
            font-size: 14px;
        }

        .form-item {
            margin-bottom: 14px;
        }

        .form-item label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .form-item input,
        .toolbar input,
        .toolbar select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            outline: none;
            font-size: 14px;
            background: #fff;
        }

        .toolbar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-ghost {
            background: #eef2ff;
            color: #3355cc;
        }

        .layout {
            display: grid;
            grid-template-columns: 240px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: #19233a;
            color: #d7def0;
            padding: 22px 14px;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            margin: 0 0 18px;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .user-block {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu button {
            border: none;
            text-align: left;
            border-radius: 10px;
            padding: 10px 12px;
            color: #d7def0;
            background: transparent;
            cursor: pointer;
        }

        .menu button.active,
        .menu button:hover {
            background: rgba(102, 140, 255, 0.2);
            color: #fff;
        }

        .logout {
            margin-top: 16px;
            width: 100%;
        }

        .main {
            padding: 22px;
        }

        .panel {
            background: var(--card);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 16px;
        }

        .section-title {
            margin: 0 0 12px;
            font-size: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }

        .stat-card {
            padding: 14px;
            border-radius: 12px;
            background: linear-gradient(120deg, #f8faff, #f0f4ff);
            border: 1px solid var(--border);
        }

        .stat-card .k {
            font-size: 12px;
            color: var(--muted);
        }

        .stat-card .v {
            font-size: 24px;
            margin-top: 4px;
            font-weight: 800;
            color: #263b7d;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .data-table th,
        .data-table td {
            border-bottom: 1px solid var(--border);
            text-align: left;
            padding: 10px 8px;
            white-space: nowrap;
        }

        .data-table th {
            color: var(--muted);
            font-weight: 600;
            font-size: 13px;
        }

        .muted {
            color: var(--muted);
            font-size: 13px;
        }

        .toast {
            position: fixed;
            top: 18px;
            right: 18px;
            padding: 10px 14px;
            border-radius: 10px;
            color: #fff;
            z-index: 99;
            font-size: 14px;
            opacity: 0;
            transform: translateY(-8px);
            transition: all .2s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }

        .two-cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 980px) {
            .layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                border-bottom: 1px solid #2d3d64;
            }
            .two-cols {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div id="toast" class="toast"></div>

<section id="loginView" class="login-wrap">
    <div class="login-card">
        <h1 class="title">TLIAS 管理后台</h1>
        <p class="subtitle">连接后端接口，快速管理员工、部门、班级、学生与统计数据。</p>
        <div class="form-item">
            <label for="username">用户名</label>
            <input id="username" type="text" placeholder="请输入用户名">
        </div>
        <div class="form-item">
            <label for="password">密码</label>
            <input id="password" type="password" placeholder="请输入密码">
        </div>
        <button id="loginBtn" class="btn btn-primary" style="width:100%;">登录</button>
        <p class="muted" style="margin-top:12px;">token 会自动保存到浏览器本地存储。</p>
    </div>
</section>

<section id="appView" class="layout hidden">
    <aside class="sidebar">
        <h2 class="brand">TLIAS Admin</h2>
        <div class="user-block">
            <div>当前用户：<strong id="userName">-</strong></div>
            <div>账号：<span id="userAccount">-</span></div>
        </div>
        <div class="menu">
            <button data-tab="dashboard" class="active">总览看板</button>
            <button data-tab="emps">员工管理</button>
            <button data-tab="depts">部门管理</button>
            <button data-tab="clazzs">班级管理</button>
            <button data-tab="students">学员管理</button>
        </div>
        <button id="logoutBtn" class="btn btn-danger logout">退出登录</button>
    </aside>

    <main class="main">
        <section class="panel tab" id="tab-dashboard">
            <h3 class="section-title">业务总览</h3>
            <div class="stats">
                <div class="stat-card"><div class="k">员工总数</div><div id="statEmp" class="v">-</div></div>
                <div class="stat-card"><div class="k">部门总数</div><div id="statDept" class="v">-</div></div>
                <div class="stat-card"><div class="k">班级总数</div><div id="statClazz" class="v">-</div></div>
                <div class="stat-card"><div class="k">学员总数</div><div id="statStu" class="v">-</div></div>
            </div>
            <div class="two-cols">
                <div class="panel" style="box-shadow:none;">
                    <h4 style="margin:0 0 10px;">员工职位分布</h4>
                    <table class="data-table">
                        <thead><tr><th>职位</th><th>人数</th></tr></thead>
                        <tbody id="jobTable"></tbody>
                    </table>
                </div>
                <div class="panel" style="box-shadow:none;">
                    <h4 style="margin:0 0 10px;">员工性别分布</h4>
                    <table class="data-table">
                        <thead><tr><th>性别</th><th>人数</th></tr></thead>
                        <tbody id="genderTable"></tbody>
                    </table>
                </div>
            </div>
            <div class="two-cols" style="margin-top:12px;">
                <div class="panel" style="box-shadow:none;">
                    <h4 style="margin:0 0 10px;">班级人数统计</h4>
                    <table class="data-table">
                        <thead><tr><th>班级</th><th>人数</th></tr></thead>
                        <tbody id="clazzNumTable"></tbody>
                    </table>
                </div>
                <div class="panel" style="box-shadow:none;">
                    <h4 style="margin:0 0 10px;">学员学历分布</h4>
                    <table class="data-table">
                        <thead><tr><th>学历</th><th>人数</th></tr></thead>
                        <tbody id="degreeTable"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="panel tab hidden" id="tab-emps">
            <h3 class="section-title">员工管理</h3>
            <div class="toolbar">
                <input id="empName" placeholder="姓名关键字">
                <select id="empGender">
                    <option value="">全部性别</option>
                    <option value="1">男</option>
                    <option value="2">女</option>
                </select>
                <input id="empBegin" type="date">
                <input id="empEnd" type="date">
                <button class="btn btn-primary" onclick="loadEmps()">查询</button>
            </div>
            <table class="data-table">
                <thead>
                <tr><th>ID</th><th>姓名</th><th>性别</th><th>职位</th><th>部门</th><th>手机号</th><th>入职日期</th></tr>
                </thead>
                <tbody id="empTable"></tbody>
            </table>
        </section>

        <section class="panel tab hidden" id="tab-depts">
            <h3 class="section-title">部门管理</h3>
            <div class="toolbar">
                <input id="deptName" placeholder="输入新部门名称">
                <button class="btn btn-primary" onclick="addDept()">新增部门</button>
                <input id="deptDeleteId" placeholder="输入要删除的部门ID">
                <button class="btn btn-danger" onclick="deleteDept()">删除部门</button>
                <button class="btn btn-ghost" onclick="loadDepts()">刷新</button>
            </div>
            <table class="data-table">
                <thead><tr><th>ID</th><th>部门名称</th><th>创建时间</th></tr></thead>
                <tbody id="deptTable"></tbody>
            </table>
        </section>

        <section class="panel tab hidden" id="tab-clazzs">
            <h3 class="section-title">班级管理</h3>
            <div class="toolbar">
                <input id="clazzName" placeholder="班级名关键字">
                <input id="clazzBegin" type="date">
                <input id="clazzEnd" type="date">
                <button class="btn btn-primary" onclick="loadClazzs()">查询</button>
            </div>
            <table class="data-table">
                <thead><tr><th>ID</th><th>班级名称</th><th>教室</th><th>班主任</th><th>学科</th><th>状态</th></tr></thead>
                <tbody id="clazzTable"></tbody>
            </table>
        </section>

        <section class="panel tab hidden" id="tab-students">
            <h3 class="section-title">学员管理</h3>
            <div class="toolbar">
                <input id="stuName" placeholder="姓名关键字">
                <select id="stuDegree">
                    <option value="">全部学历</option>
                    <option value="1">初中</option>
                    <option value="2">高中</option>
                    <option value="3">大专</option>
                    <option value="4">本科</option>
                    <option value="5">硕士</option>
                    <option value="6">博士</option>
                </select>
                <input id="stuClazzId" placeholder="班级ID">
                <button class="btn btn-primary" onclick="loadStudents()">查询</button>
            </div>
            <table class="data-table">
                <thead><tr><th>ID</th><th>姓名</th><th>班级</th><th>学历</th><th>手机号</th><th>违纪次数</th><th>违纪扣分</th></tr></thead>
                <tbody id="studentTable"></tbody>
            </table>
        </section>
    </main>
</section>

<script>
    const state = {
        token: localStorage.getItem("token") || "",
        user: JSON.parse(localStorage.getItem("user") || "null")
    };

    const jobMap = {1: "班主任", 2: "讲师", 3: "学工主管", 4: "教研主管", 5: "咨询师"};
    const degreeMap = {1: "初中", 2: "高中", 3: "大专", 4: "本科", 5: "硕士", 6: "博士"};

    function showToast(msg, type = "success") {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.className = "toast " + type + " show";
        setTimeout(() => {
            t.className = "toast " + type;
        }, 1800);
    }

    async function api(path, options = {}) {
        const headers = Object.assign({}, options.headers || {});
        if (state.token) {
            headers["token"] = state.token;
        }
        if (options.body && !(options.body instanceof FormData)) {
            headers["Content-Type"] = "application/json";
        }
        const res = await fetch(path, Object.assign({}, options, {headers}));
        if (res.status === 401) {
            logout("登录已失效，请重新登录");
            throw new Error("unauthorized");
        }
        const data = await res.json();
        if (data.code !== 1) {
            throw new Error(data.msg || "接口调用失败");
        }
        return data.data;
    }

    function setHTML(id, html) {
        document.getElementById(id).innerHTML = html;
    }

    function renderRows(list, columns, emptyText = "暂无数据") {
        if (!list || list.length === 0) {
            return `<tr><td colspan="${columns.length}" class="muted">${emptyText}</td></tr>`;
        }
        return list.map(row => `<tr>${columns.map(fn => `<td>${fn(row) ?? "-"}</td>`).join("")}</tr>`).join("");
    }

    async function login() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        if (!username || !password) {
            showToast("请输入账号和密码", "error");
            return;
        }
        try {
            const data = await api("/login", {
                method: "POST",
                body: JSON.stringify({username, password})
            });
            state.token = data.token;
            state.user = data;
            localStorage.setItem("token", data.token);
            localStorage.setItem("user", JSON.stringify(data));
            showApp();
            showToast("登录成功");
            await refreshAll();
        } catch (e) {
            showToast(e.message, "error");
        }
    }

    function logout(tip = "已退出登录") {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        state.token = "";
        state.user = null;
        document.getElementById("appView").classList.add("hidden");
        document.getElementById("loginView").classList.remove("hidden");
        showToast(tip, "success");
    }

    function showApp() {
        document.getElementById("loginView").classList.add("hidden");
        document.getElementById("appView").classList.remove("hidden");
        document.getElementById("userName").textContent = state.user?.name || "-";
        document.getElementById("userAccount").textContent = state.user?.username || "-";
    }

    function initTabs() {
        const buttons = Array.from(document.querySelectorAll(".menu button[data-tab]"));
        const tabs = Array.from(document.querySelectorAll(".tab"));
        buttons.forEach(btn => {
            btn.addEventListener("click", async () => {
                buttons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                tabs.forEach(tab => tab.classList.add("hidden"));
                document.getElementById("tab-" + btn.dataset.tab).classList.remove("hidden");
                if (btn.dataset.tab === "dashboard") await loadDashboard();
                if (btn.dataset.tab === "emps") await loadEmps();
                if (btn.dataset.tab === "depts") await loadDepts();
                if (btn.dataset.tab === "clazzs") await loadClazzs();
                if (btn.dataset.tab === "students") await loadStudents();
            });
        });
    }

    async function loadDashboard() {
        try {
            const [emp, dept, clazz, stu] = await Promise.all([
                api("/emps?page=1&pageSize=1"),
                api("/depts"),
                api("/clazzs?page=1&pageSize=1"),
                api("/students?page=1&pageSize=1")
            ]);
            document.getElementById("statEmp").textContent = emp.total ?? 0;
            document.getElementById("statDept").textContent = (dept || []).length;
            document.getElementById("statClazz").textContent = clazz.total ?? 0;
            document.getElementById("statStu").textContent = stu.total ?? 0;

            const [job, gender, clazzNum, degree] = await Promise.all([
                api("/report/empJobData"),
                api("/report/empGenderData"),
                api("/report/studentCountData"),
                api("/report/studentDegreeData")
            ]);
            setHTML("jobTable", renderRows(job.dataList || [], [r => r.pos, r => r.total], "暂无职位数据"));
            setHTML("genderTable", renderRows(gender || [], [r => r.name, r => r.value], "暂无性别数据"));
            setHTML("clazzNumTable", renderRows(clazz.dataList || [], [r => r.clazz, r => r.value], "暂无班级数据"));
            setHTML("degreeTable", renderRows(degree || [], [r => r.name, r => r.value], "暂无学历数据"));
        } catch (e) {
            showToast(e.message, "error");
        }
    }

    async function loadEmps() {
        const name = document.getElementById("empName").value.trim();
        const gender = document.getElementById("empGender").value;
        const begin = document.getElementById("empBegin").value;
        const end = document.getElementById("empEnd").value;
        const params = new URLSearchParams({page: "1", pageSize: "20"});
        if (name) params.append("name", name);
        if (gender) params.append("gender", gender);
        if (begin) params.append("begin", begin);
        if (end) params.append("end", end);
        try {
            const data = await api("/emps?" + params.toString());
            const rows = data.rows || [];
            setHTML("empTable", renderRows(rows, [
                r => r.id,
                r => r.name,
                r => r.gender === 1 ? "男" : "女",
                r => jobMap[r.job] || r.job,
                r => r.deptName || r.deptId,
                r => r.phone,
                r => r.entryDate
            ]));
        } catch (e) {
            showToast(e.message, "error");
        }
    }

    async function loadDepts() {
        try {
            const data = await api("/depts");
            setHTML("deptTable", renderRows(data || [], [r => r.id, r => r.name, r => r.createTime]));
        } catch (e) {
            showToast(e.message, "error");
        }
    }

    async function addDept() {
        const name = document.getElementById("deptName").value.trim();
        if (!name) {
            showToast("请输入部门名称", "error");
            return;
        }
        try {
            await api("/depts", {method: "POST", body: JSON.stringify({name})});
            document.getElementById("deptName").value = "";
            showToast("部门新增成功");
            await loadDepts();
        } catch (e) {
            showToast(e.message, "error");
        }
    }

    async function deleteDept() {
        const id = document.getElementById("deptDeleteId").value.trim();
        if (!id) {
            showToast("请输入部门ID", "error");
            return;
        }
        try {
            await api("/depts?id=" + encodeURIComponent(id), {method: "DELETE"});
            document.getElementById("deptDeleteId").value = "";
            showToast("部门删除成功");
            await loadDepts();
        } catch (e) {
            showToast(e.message, "error");
        }
    }

    async function loadClazzs() {
        const name = document.getElementById("clazzName").value.trim();
        const begin = document.getElementById("clazzBegin").value;
        const end = document.getElementById("clazzEnd").value;
        const params = new URLSearchParams({page: "1", pageSize: "20"});
        if (name) params.append("name", name);
        if (begin) params.append("begin", begin);
        if (end) params.append("end", end);
        try {
            const data = await api("/clazzs?" + params.toString());
            setHTML("clazzTable", renderRows(data.rows || [], [
                r => r.id,
                r => r.name,
                r => r.room,
                r => r.masterName || r.masterId,
                r => r.subject,
                r => r.status
            ]));
        } catch (e) {
            showToast(e.message, "error");
        }
    }

    async function loadStudents() {
        const name = document.getElementById("stuName").value.trim();
        const degree = document.getElementById("stuDegree").value;
        const clazzId = document.getElementById("stuClazzId").value.trim();
        const params = new URLSearchParams({page: "1", pageSize: "20"});
        if (name) params.append("name", name);
        if (degree) params.append("degree", degree);
        if (clazzId) params.append("clazzId", clazzId);
        try {
            const data = await api("/students?" + params.toString());
            setHTML("studentTable", renderRows(data.rows || [], [
                r => r.id,
                r => r.name,
                r => r.clazzName || r.clazzId,
                r => degreeMap[r.degree] || r.degree,
                r => r.phone,
                r => r.violationCount,
                r => r.violationScore
            ]));
        } catch (e) {
            showToast(e.message, "error");
        }
    }

    async function refreshAll() {
        await Promise.all([loadDashboard(), loadEmps(), loadDepts(), loadClazzs(), loadStudents()]);
    }

    document.getElementById("loginBtn").addEventListener("click", login);
    document.getElementById("logoutBtn").addEventListener("click", () => logout());
    initTabs();

    if (state.token && state.user) {
        showApp();
        refreshAll().catch(e => showToast(e.message, "error"));
    }
</script>
</body>
</html>
